version: 2
updates:
  # Keep the GitHub Actions used by the workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release before proposing it
    cooldown:
      default-days: 7

  # The app's one Swift package, MASShortcut, is pinned to a revision in the Xcode project.
  # Dependabot's swift support reads Package.swift only, so it can't propose updates here;
  # move the pin by hand when MASShortcut changes.
