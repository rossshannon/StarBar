version: 2
updates:
  # Keep the GitHub Actions used by the workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release before proposing it
    cooldown:
      default-days: 7

  # Swift packages used by the SDK package. MASShortcut is required by branch (master),
  # not by version, so don't expect Dependabot pull requests for it: update it with
  # `swift package update` in SDK/. Packages required by version are covered.
  - package-ecosystem: swift
    directory: /SDK
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
