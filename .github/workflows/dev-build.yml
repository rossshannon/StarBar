name: StarBar Dev build

# Builds every pull request as StarBar Dev (./build.sh --dev) and attaches the zipped app to
# the run, so a pull request can be tried beside the everyday StarBar without building it on
# a Mac first. Download it from the run's Summary page, under Artifacts.
#
# The app is signed ad hoc and not notarised, so macOS blocks it the first time it opens:
# allow it under System Settings > Privacy & Security > Open Anyway.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the older build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build StarBar Dev
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's own head commit, as a checkout of its branch on a Mac would
          # build it, rather than its merge with main, so the commit the About window shows
          # is one on the branch
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # The version comes from the latest v* tag and the build number from the commit
          # count, which a shallow clone can't give
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # GITHUB_HEAD_REF names the branch, since the checkout is detached. No Last.fm key or
      # secret, on purpose: this runs the pull request's own build.sh, which would then decide
      # what happens to them, and the zip is downloadable. So this build can't connect to
      # Last.fm; a StarBar Dev built on the Mac with ./build.sh --dev --install can.
      - name: Build StarBar Dev
        run: ./build.sh --dev

      # ditto keeps the bundle's symlinks, permissions and signature, which the artifact's own
      # zip would not, so the zip goes up as it is
      - name: Zip the app
        id: zip
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          if [ -n "$PR_NUMBER" ]; then
            ZIP="StarBar-Dev-PR$PR_NUMBER-$COMMIT.zip"
          else
            ZIP="StarBar-Dev-$COMMIT.zip"
          fi
          ditto -c -k --sequesterRsrc --keepParent "build/dev/Build/Products/Release/StarBar Dev.app" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          {
            echo "### StarBar Dev"
            echo ""
            echo "\`$ZIP\` is under Artifacts below. It installs as /Applications/StarBar Dev.app, beside StarBar, and the two take turns: the one opened last runs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.zip.outputs.zip }}
          archive: false
          retention-days: 30
          if-no-files-found: error
