name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The tests only need to read the code
permissions:
  contents: read

# A new push to the same branch or pull request cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The macOS 27 image is a GitHub preview with an Xcode beta; its failures don't fail the run
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15
            runner: macos-15
            preview: false
          - name: macOS 26
            runner: macos-26
            preview: false
          - name: macOS 27
            runner: xcode-27
            preview: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          sw_vers
          xcodebuild -version

      - name: Build Release
        run: ./build.sh

      # Skips the tests that need Music (ScriptBridgeTests, iTunesLibraryTests); run those
      # locally with ./build.sh --test-all
      - name: Run tests
        run: ./build.sh --test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.runner }}
          path: |
            build/test/test.log
            build/test/results/
          if-no-files-found: ignore

  # Clicks and drags the real menu bar. The app runs with -UITesting YES, so no Music is needed.
  # Two versions, because the menu bar delivers clicks differently: macOS 27 sends one click on
  # mouse down and no drag events; macOS 26 and earlier send real drag events.
  ui-test:
    name: ui-test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26
            runner: macos-26
            preview: false
          - name: macOS 27
            runner: xcode-27
            preview: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          sw_vers
          xcodebuild -version

      # UI tests need macOS Automation Mode, which otherwise asks for a password
      - name: Allow UI automation
        run: |
          sudo automationmodetool enable-automationmode-without-authentication
          automationmodetool

      - name: Run UI tests
        run: ./build.sh --ui-test

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.runner }}
          path: |
            build/test/ui-test.log
            build/test/results/
          if-no-files-found: ignore
