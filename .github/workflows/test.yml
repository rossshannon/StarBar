name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch or pull request cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Release
        run: ./build.sh

      # Skips the tests that need Music (ScriptBridgeTests, iTunesLibraryTests); run those
      # locally with ./build.sh --test-all
      - name: Run tests
        run: ./build.sh --test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test/test.log
            build/test/results/
          if-no-files-found: ignore

  # Clicks and drags the real menu bar. The app runs with -UITesting YES, so no Music is needed.
  ui-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # UI tests need macOS Automation Mode, which otherwise asks for a password
      - name: Allow UI automation
        run: |
          sudo automationmodetool enable-automationmode-without-authentication
          automationmodetool

      - name: Run UI tests
        run: ./build.sh --ui-test

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            build/test/ui-test.log
            build/test/results/
          if-no-files-found: ignore
