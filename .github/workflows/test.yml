name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          xcodebuild build \
            -project "Song Rating.xcodeproj" \
            -scheme "Song Rating" \
            -configuration Release \
            -derivedDataPath build

      - name: Run SDK tests
        run: cd SDK && swift test
