name: Release

# Push a tag like v1.6.0 to test, build and publish a GitHub release with the zipped app.
# The v prefix keeps these tags apart from upstream's version tags (1.5.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # The tag becomes CFBundleShortVersionString, which must be three numbers, so refuse
      # tags like v1.6.0-beta1 before building anything
      - name: Check tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.6.0, not $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build and tests don't need the write token; only gh release create uses it
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run tests
        run: ./build.sh --test

      - name: Build Release
        run: |
          xcodebuild build \
            -project "StarBar.xcodeproj" \
            -scheme "StarBar" \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}"

      # ditto keeps the bundle's symlinks, extended attributes and ad-hoc signature intact
      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/StarBar.app" \
            "StarBar-$GITHUB_REF_NAME.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "StarBar-$GITHUB_REF_NAME.zip" \
            --title "StarBar ${GITHUB_REF_NAME#v}" \
            --generate-notes
