name: Release

# Push a tag like v1.1.0 to test, build and publish a GitHub release with the zipped app.
# The v prefix keeps these tags apart from upstream's version tags (1.5.0).
#
# Signing and notarisation run only when the repository has these secrets; without them
# the app is signed ad hoc and macOS asks the user to allow it once, as the README says.
#   MACOS_CERTIFICATE_P12          Developer ID Application certificate + key, base64 of the .p12
#   MACOS_CERTIFICATE_PASSWORD     the .p12's password
#   APPLE_TEAM_ID                  the ten-character team ID on the certificate
#   APPLE_ID                       the Apple ID that submits to the notary service
#   APPLE_APP_SPECIFIC_PASSWORD    an app-specific password for that Apple ID (appleid.apple.com)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # Notarisation alone may wait up to 30 minutes
    timeout-minutes: 75
    env:
      # Secrets can't be tested in a step's `if` directly, so the decision is made here once
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
      # Any of the five set means all five are meant to be
      HAS_ANY_SECRET: ${{ secrets.MACOS_CERTIFICATE_P12 != '' || secrets.MACOS_CERTIFICATE_PASSWORD != '' || secrets.APPLE_TEAM_ID != '' || secrets.APPLE_ID != '' || secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}

    steps:
      # The tag becomes CFBundleShortVersionString, which must be three numbers, so refuse
      # tags like v1.1.0-beta1 before building anything
      - name: Check tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.1.0, not $GITHUB_REF_NAME"
            exit 1
          fi

      # A Developer ID signature without notarisation is still blocked by Gatekeeper, and a
      # partly configured repository would silently ship ad hoc, so anything short of all five
      # secrets fails here
      - name: Check the secrets go together
        run: |
          if [ "$HAS_ANY_SECRET" = "true" ] && { [ "$HAS_SIGNING" != "true" ] || [ "$HAS_NOTARY" != "true" ]; }; then
            echo "::error::Some signing secrets are set but not all five (MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_TEAM_ID, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD); add the rest or remove them all"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build and tests don't need the write token; only gh release create uses it
          persist-credentials: false
          # build.sh takes the build number from the commit count, which a shallow clone can't give
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run tests
        run: ./build.sh --test

      - name: Import the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A throwaway keychain, so nothing lands in the runner's login keychain
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/certificate.p12"
          # The identity's full name, for build.sh: the quoted field of the first matching line
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          case "$IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "::error::The certificate is not a Developer ID Application identity (found '$IDENTITY')"; exit 1 ;;
          esac
          echo "STARBAR_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "STARBAR_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      # build.sh signs with STARBAR_CODESIGN_IDENTITY when it is set, ad hoc otherwise, and
      # takes the build number from the commit count
      - name: Build Release
        run: ./build.sh --clean --version="${GITHUB_REF_NAME#v}"

      - name: Check the signature
        run: |
          APP="build/Build/Products/Release/StarBar.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|Timestamp)=" || true

      # ditto keeps the bundle's symlinks, extended attributes and signature intact
      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/StarBar.app" \
            "StarBar-$GITHUB_REF_NAME.zip"

      - name: Notarise
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "StarBar-$GITHUB_REF_NAME.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          # The ticket is stapled to the app, so it opens offline; the zip is rebuilt to carry it
          xcrun stapler staple "build/Build/Products/Release/StarBar.app"
          xcrun stapler validate "build/Build/Products/Release/StarBar.app"
          # What Gatekeeper will say when the user opens it
          spctl --assess --type execute --verbose=2 "build/Build/Products/Release/StarBar.app"
          rm "StarBar-$GITHUB_REF_NAME.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/StarBar.app" \
            "StarBar-$GITHUB_REF_NAME.zip"

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security list-keychains -d user -s login.keychain
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Checksum
        run: shasum -a 256 "StarBar-$GITHUB_REF_NAME.zip" | tee "StarBar-$GITHUB_REF_NAME.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP="build/Build/Products/Release/StarBar.app"
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          if [ "$HAS_SIGNING" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then
            SIGNING="Signed with Developer ID and notarised."
          else
            SIGNING="Signed ad hoc, not notarised: macOS blocks it the first time it opens. Allow it under System Settings > Privacy & Security > Open Anyway."
          fi
          gh release create "$GITHUB_REF_NAME" \
            "StarBar-$GITHUB_REF_NAME.zip" "StarBar-$GITHUB_REF_NAME.zip.sha256" \
            --title "StarBar ${GITHUB_REF_NAME#v}" \
            --notes "Build $BUILD. $SIGNING" \
            --generate-notes
